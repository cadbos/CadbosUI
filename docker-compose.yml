services:
  albyhub:
    image: ghcr.io/getalby/hub:v1.23.0
    volumes:
      - ${ALBYHUB_DATA:-./ddata/albyhub}:/data
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      - WORK_DIR=/data/albyhub
    stop_grace_period: 300s
    restart: unless-stopped

  lnbits:
    image: lnbits/lnbits:v1.5.6
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - ${LNBITS_DATA:-./ddata/lnbits}:/app/data
    env_file:
      - ${LNBITS_ENV_FILE:-./.lnbits.env}
    environment:
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 300s
    restart: unless-stopped

  db:
    image: postgres:16
    volumes:
      - ${PG_DATA:-./ddata/pg}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-lnbits}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    stop_grace_period: 300s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
